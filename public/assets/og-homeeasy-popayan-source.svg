<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" style="display:block;width:100vw;height:100vh" role="img" aria-labelledby="title description">
  <title id="title">HomeEasy · Visita sin costo</title>
  <desc id="description">Imagen de HomeEasy con Hommy, su personaje de marca, y datos reales del servicio: visita sin costo, medición, fabricación e instalación en Transversal 9 # 6N-26, Popayán.</desc>
  <defs>
