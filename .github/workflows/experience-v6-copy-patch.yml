name: Experience v6 copy patch

on:
  push:
    branches: [feat/experience-v6]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/experience-v6
      - name: Shorten visible home copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.jsx')
          text = path.read_text()
          replacements = {
            'Responde unas preguntas sobre tu ventana y te mostrará los sistemas que mejor encajan.':
              'Cuéntale cómo es tu ventana. Hommy filtra las opciones por ti.',
            'Explora las persianas según lo que necesitas controlar.':
              'Encuentra la persiana por lo que quieres lograr.',
            'Compara luz, privacidad, tamaño, tejido y accionamiento para entender rápidamente qué sistema puede funcionar mejor.':
              'Empieza por luz, privacidad, oscuridad o tamaño.',
            'El papel de colgadura transforma el carácter del espacio.':
              'Una pared puede cambiar toda la habitación.',
            'Con la referencia adecuada, el papel de colgadura aporta estilo, profundidad y personalidad al ambiente. En HomeEasy te ayudamos a elegir la opción ideal según tu espacio.':
              'Compara el antes y después. Elige textura, escala y tono con el espacio delante.',
            'Colección Conceptos: referencias lavables, con buena resistencia a la luz y fáciles de retirar. La referencia y cantidad se confirman para cada muro.':
              'La referencia y cantidad se confirman para cada muro.',
          }

          missing = []
          for old, new in replacements.items():
            if old in text:
              text = text.replace(old, new)
            elif new not in text:
              missing.append(old)

          if missing:
            raise SystemExit('Expected copy not found: ' + repr(missing))

          path.write_text(text)
          PY
      - name: Commit copy changes
        run: |
          if git diff --quiet; then
            echo "No copy changes needed."
            exit 0
          fi
          git config user.name "HomeEasy UX QA"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Tighten HomeEasy section copy"
          git push origin HEAD:feat/experience-v6
