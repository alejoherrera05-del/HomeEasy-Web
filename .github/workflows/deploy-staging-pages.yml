name: Deploy HomeEasy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homeeasy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build staging site
        run: pnpm exec vite build --base=/HomeEasy-Web/

      - name: Adapt public asset URLs for project Pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('dist/client')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.css'}:
                  continue
              text = path.read_text()
              text = text.replace('"/assets/', '"/HomeEasy-Web/assets/')
              text = text.replace("'/assets/", "'/HomeEasy-Web/assets/")
              text = text.replace('url(/assets/', 'url(/HomeEasy-Web/assets/')
              path.write_text(text)

          index = root / 'index.html'
          assert index.exists()
          bundle_text = '\n'.join(
              p.read_text() for p in root.rglob('*')
              if p.is_file() and p.suffix in {'.html', '.js', '.css'}
          )
          assert '/assets/hommy-hero-approved.png' not in bundle_text
          assert '/HomeEasy-Web/assets/hommy-hero-approved.png' in bundle_text
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy staging
        id: deployment
        uses: actions/deploy-pages@v4
