name: Deploy HomeEasy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homeeasy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build staging site
        run: pnpm exec vite build --base=/HomeEasy-Web/

      - name: Adapt public asset URLs for Pages staging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('dist/client')
          assert (root / 'index.html').exists()
          assert (root / 'assets' / 'hommy-hero-approved.png').exists()

          pattern = re.compile(r'(?<!HomeEasy-Web)/assets/')
          changed = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.css'}:
                  continue
              text = path.read_text()
              updated, count = pattern.subn('/HomeEasy-Web/assets/', text)
              if count:
                  path.write_text(updated)
                  changed += count

          print(f'Adapted {changed} public asset URL references for GitHub Pages staging.')

          offenders = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.css'}:
                  continue
              text = path.read_text()
              match = pattern.search(text)
              if match:
                  offenders.append((str(path), text[max(0, match.start() - 80):match.start() + 120]))

          if offenders:
              print('Unadapted root asset paths remain:')
              for path, snippet in offenders[:10]:
                  print(path, snippet)
              raise SystemExit(1)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy staging
        id: deployment
        uses: actions/deploy-pages@v4
