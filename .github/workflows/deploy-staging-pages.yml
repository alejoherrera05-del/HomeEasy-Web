name: Deploy HomeEasy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homeeasy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build staging site
        run: pnpm exec vite build --base=/HomeEasy-Web/

      - name: Verify staging asset paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('dist/client')
          assert (root / 'index.html').exists()
          assert (root / 'assets' / 'hommy-hero-approved.png').exists()

          offenders = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.css'}:
                  continue
              text = path.read_text()
              for match in re.finditer(r'(?<!HomeEasy-Web)/assets/', text):
                  snippet = text[max(0, match.start() - 80):match.start() + 120]
                  offenders.append((str(path), snippet))
                  if len(offenders) >= 10:
                      break
              if len(offenders) >= 10:
                  break

          if offenders:
              print('Root-absolute asset paths still present in staging build:')
              for path, snippet in offenders:
                  print(path, snippet)
              raise SystemExit(1)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy staging
        id: deployment
        uses: actions/deploy-pages@v4
