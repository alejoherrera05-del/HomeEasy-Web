name: Deploy HomeEasy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homeeasy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare verified process image
        run: |
          node scripts/prepare-process-image.mjs
          test -s public/assets/process-materials-final.webp
          file public/assets/process-materials-final.webp
          test $(stat -c%s public/assets/process-materials-final.webp) -gt 40000

      - name: Build production site for the custom domain
        run: pnpm exec vite build --base=/

      - name: Verify local trust and SEO contract
        run: HOMEEASY_REQUIRE_DIST=1 pnpm run test:trust

      - name: Verify built process image
        run: |
          test -s dist/client/assets/process-materials-final.webp
          file dist/client/assets/process-materials-final.webp
          test $(stat -c%s dist/client/assets/process-materials-final.webp) -gt 40000

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy staging
        id: deployment
        uses: actions/deploy-pages@v4
