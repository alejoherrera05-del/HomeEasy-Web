name: Run HomeEasy user experience correction

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-user-experience-correction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply user-facing correction
        run: python scripts/user-experience-correction.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm run test:hero
          pnpm run test:hommy
          pnpm run build
          pnpm run test:sites

      - name: Commit correction and clean temporary files
        run: |
          rm scripts/user-experience-correction.py
          rm .github/workflows/run-user-experience-correction.yml
          git config user.name "alejoherrera05-del"
          git config user.email "alejoherrera05@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct HomeEasy hero and conversion experience"
          git push origin main
