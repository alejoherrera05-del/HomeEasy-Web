name: Deploy HomeEasy art direction preview

on:
  push:
    branches:
      - feat/art-direction-process-contact-final
    paths:
      - .github/workflows/deploy-art-direction-preview.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homeeasy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build staging site
        run: pnpm exec vite build --base=/HomeEasy-Web/

      - name: Adapt public asset URLs for Pages staging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('dist/client')
          pattern = re.compile(r'(?<!HomeEasy-Web)/assets/')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.html', '.js', '.css'}:
                  continue
              text = path.read_text()
              updated = pattern.sub('/HomeEasy-Web/assets/', text)
              if updated != text:
                  path.write_text(updated)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
