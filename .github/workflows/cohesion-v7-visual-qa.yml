name: Cohesion v7 visual QA

on:
  push:
    branches: [feat/home-cohesion-v7]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build
        run: |
          pnpm test
          pnpm exec vite build --base=/
          test -s dist/client/assets/process-materials-final.webp
          file dist/client/assets/process-materials-final.webp
          test $(stat -c%s dist/client/assets/process-materials-final.webp) -gt 10000
      - name: Upload built site for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: cohesion-v7-build
          path: dist/client
          retention-days: 1
