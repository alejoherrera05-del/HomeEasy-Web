name: Cohesion v7 visual QA

on:
  push:
    branches: [feat/home-cohesion-v7]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build
        run: |
          pnpm test
          node scripts/prepare-process-image.mjs
          pnpm exec vite build --base=/
          test -s dist/client/assets/process-materials-final.webp
          file dist/client/assets/process-materials-final.webp
          test $(stat -c%s dist/client/assets/process-materials-final.webp) -gt 30000
      - name: Capture real section screenshots
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/ > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          rm -rf /tmp/homeeasy-chrome
          nohup "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/homeeasy-chrome about:blank > /tmp/chrome.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep .5; done
          node <<'NODE'
          const fs = require('fs');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function createPage() {
            const response = await fetch('http://127.0.0.1:9222/json/new?' + encodeURIComponent('http://127.0.0.1:4173/'), { method: 'PUT' });
            return response.json();
          }

          async function main() {
            const page = await createPage();
            const ws = new WebSocket(page.webSocketDebuggerUrl);
            let messageId = 0;
            const pending = new Map();
            const send = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++messageId;
              pending.set(id, { resolve, reject });
              ws.send(JSON.stringify({ id, method, params }));
            });
            ws.onmessage = (event) => {
              const message = JSON.parse(event.data);
              if (!message.id || !pending.has(message.id)) return;
              const { resolve, reject } = pending.get(message.id);
              pending.delete(message.id);
              if (message.error) reject(message.error);
              else resolve(message.result);
            };
            await new Promise((resolve) => { ws.onopen = resolve; });
            await send('Page.enable');
            await send('Runtime.enable');

            async function capture({ width, height, mobile, id, file }) {
              await send('Emulation.setDeviceMetricsOverride', {
                width, height, deviceScaleFactor: 1, mobile,
                screenWidth: width, screenHeight: height,
              });
              await send('Page.navigate', { url: 'http://127.0.0.1:4173/' });
              await sleep(2200);
              const result = await send('Runtime.evaluate', {
                expression: `(() => {
                  document.documentElement.style.scrollBehavior='auto';
                  const node=document.getElementById('${id}');
                  if (!node) return {found:false, y:scrollY, h:document.body.scrollHeight};
                  node.scrollIntoView({block:'start'});
                  scrollBy(0,-82);
                  const processImage=document.querySelector('.process-v5-visual img');
                  return {
                    found:true,
                    y:scrollY,
                    h:document.body.scrollHeight,
                    imageComplete:processImage?.complete,
                    imageWidth:processImage?.naturalWidth || 0,
                    imageHeight:processImage?.naturalHeight || 0,
                    top:node.getBoundingClientRect().top
                  };
                })()`,
                returnByValue: true,
              });
              console.log(file, result.result.value);
              if (id === 'proceso' && (!result.result.value?.imageComplete || result.result.value?.imageWidth < 600)) process.exit(2);
              await sleep(500);
              const shot = await send('Page.captureScreenshot', { format: 'png', captureBeyondViewport: false });
              fs.writeFileSync(file, Buffer.from(shot.data, 'base64'));
            }

            for (const item of [
              { width:1440, height:900, mobile:false, id:'productos', file:'qa-desktop-catalog.png' },
              { width:1440, height:900, mobile:false, id:'papel-tapiz', file:'qa-desktop-wallpaper.png' },
              { width:1440, height:900, mobile:false, id:'proceso', file:'qa-desktop-process.png' },
              { width:1440, height:900, mobile:false, id:'contacto', file:'qa-desktop-contact.png' },
              { width:390, height:844, mobile:true, id:'productos', file:'qa-mobile-catalog.png' },
              { width:390, height:844, mobile:true, id:'papel-tapiz', file:'qa-mobile-wallpaper.png' },
              { width:390, height:844, mobile:true, id:'proceso', file:'qa-mobile-process.png' },
              { width:390, height:844, mobile:true, id:'contacto', file:'qa-mobile-contact.png' },
            ]) await capture(item);

            ws.close();
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cohesion-v7-screenshots
          path: qa-*.png
          retention-days: 1
      - name: Upload built site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cohesion-v7-build
          path: dist/client
          retention-days: 1
