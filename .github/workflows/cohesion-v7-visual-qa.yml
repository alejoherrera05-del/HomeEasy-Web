name: Cohesion v7 visual QA

on:
  push:
    branches: [feat/home-cohesion-v7]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build
        run: |
          pnpm test
          pnpm exec vite build --base=/
          test -s dist/client/assets/process-materials-final.webp
          file dist/client/assets/process-materials-final.webp
          test $(stat -c%s dist/client/assets/process-materials-final.webp) -gt 10000
      - name: Capture desktop and mobile with system Chrome
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/ > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --version
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,900 --screenshot=qa-desktop-catalog.png 'http://127.0.0.1:4173/#productos'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,900 --screenshot=qa-desktop-wallpaper.png 'http://127.0.0.1:4173/#papel-tapiz'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,900 --screenshot=qa-desktop-process.png 'http://127.0.0.1:4173/#proceso'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,900 --screenshot=qa-desktop-contact.png 'http://127.0.0.1:4173/#contacto'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=qa-mobile-catalog.png 'http://127.0.0.1:4173/#productos'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=qa-mobile-wallpaper.png 'http://127.0.0.1:4173/#papel-tapiz'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=qa-mobile-process.png 'http://127.0.0.1:4173/#proceso'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=qa-mobile-contact.png 'http://127.0.0.1:4173/#contacto'
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cohesion-v7-screenshots
          path: qa-*.png
          retention-days: 1
