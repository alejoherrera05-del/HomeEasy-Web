name: Lightweight v9 visual QA

on:
  push:
    branches: [feat/lightweight-flow-v9]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare capture helper
        run: |
          cat > /tmp/capture-homeeasy.mjs <<'NODE'
          import fs from 'node:fs';
          const port = Number(process.env.PORT || 4173);
          const prefix = process.env.PREFIX || 'head';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function createPage(url) {
            const response = await fetch('http://127.0.0.1:9222/json/new?' + encodeURIComponent(url), { method: 'PUT' });
            return response.json();
          }

          const page = await createPage(`http://127.0.0.1:${port}/`);
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          let messageId = 0;
          const pending = new Map();
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++messageId;
            pending.set(id, { resolve, reject });
            ws.send(JSON.stringify({ id, method, params }));
          });
          ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (!message.id || !pending.has(message.id)) return;
            const { resolve, reject } = pending.get(message.id);
            pending.delete(message.id);
            if (message.error) reject(message.error);
            else resolve(message.result);
          };
          await new Promise((resolve) => { ws.onopen = resolve; });
          await send('Page.enable');
          await send('Runtime.enable');

          async function navigate(width, height, mobile) {
            await send('Emulation.setDeviceMetricsOverride', {
              width, height, deviceScaleFactor: 1, mobile,
              screenWidth: width, screenHeight: height,
            });
            await send('Page.navigate', { url: `http://127.0.0.1:${port}/` });
            await sleep(2400);
            await send('Runtime.evaluate', {
              expression: `(() => { document.documentElement.style.scrollBehavior='auto'; scrollTo(0,0); return document.body.scrollHeight; })()`,
              returnByValue: true,
            });
          }

          async function revealAll() {
            await send('Runtime.evaluate', {
              expression: `(async () => {
                const wait = (ms) => new Promise(r => setTimeout(r, ms));
                const step = Math.max(320, innerHeight * .72);
                for (let y = 0; y < document.body.scrollHeight; y += step) {
                  scrollTo(0, y);
                  await wait(90);
                }
                scrollTo(0, document.body.scrollHeight);
                await wait(220);
                scrollTo(0, 0);
                await wait(450);
                return document.body.scrollHeight;
              })()`,
              awaitPromise: true,
              returnByValue: true,
            });
          }

          async function full(width, height, mobile, file) {
            await navigate(width, height, mobile);
            await revealAll();
            const metrics = await send('Page.getLayoutMetrics');
            const size = metrics.cssContentSize || metrics.contentSize;
            const shot = await send('Page.captureScreenshot', {
              format: 'png',
              captureBeyondViewport: true,
              clip: { x: 0, y: 0, width: Math.min(size.width, width), height: size.height, scale: 1 },
            });
            fs.writeFileSync(file, Buffer.from(shot.data, 'base64'));
          }

          async function section(width, height, mobile, id, file) {
            await navigate(width, height, mobile);
            await send('Runtime.evaluate', {
              expression: `(() => {
                const node=document.getElementById('${id}');
                if (!node) return false;
                node.scrollIntoView({block:'start'});
                scrollBy(0,-76);
                return true;
              })()`,
              returnByValue: true,
            });
            await sleep(650);
            const shot = await send('Page.captureScreenshot', { format: 'png', captureBeyondViewport: false });
            fs.writeFileSync(file, Buffer.from(shot.data, 'base64'));
          }

          const sections = ['inicio', 'recomendador', 'productos', 'papel-tapiz', 'proceso', 'contacto'];
          await full(1440, 900, false, `${prefix}-desktop-full.png`);
          await full(390, 844, true, `${prefix}-mobile-full.png`);
          for (const id of sections) {
            await section(1440, 900, false, id, `${prefix}-desktop-${id}.png`);
            await section(390, 844, true, id, `${prefix}-mobile-${id}.png`);
          }
          ws.close();
          NODE
      - name: Start Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          nohup "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/homeeasy-chrome about:blank > /tmp/chrome.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep .5; done
      - name: Capture current main
        run: |
          git checkout main
          pnpm install --frozen-lockfile
          node scripts/prepare-process-image.mjs
          pnpm exec vite build --base=/
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/ > /tmp/vite-base.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          PREFIX=before PORT=4173 node /tmp/capture-homeeasy.mjs
          pkill -f "vite preview.*4173" || true
      - name: Capture proposed version
        run: |
          git checkout "$GITHUB_SHA"
          pnpm install --frozen-lockfile
          pnpm test
          node scripts/prepare-process-image.mjs
          pnpm exec vite build --base=/
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4174 --base=/ > /tmp/vite-head.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          PREFIX=after PORT=4174 node /tmp/capture-homeeasy.mjs
      - name: Upload before and after screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-v9-screenshots
          path: |
            before-*.png
            after-*.png
          retention-days: 1
