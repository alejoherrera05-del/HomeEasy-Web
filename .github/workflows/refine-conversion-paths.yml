name: Refine HomeEasy conversion paths

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-conversion-paths.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine contextual CTAs and production metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app = Path('src/App.jsx')
          s = app.read_text()

          s = s.replace('function Products() {', 'function Products({ openAdvisorFor }) {')
          s = s.replace('function Wallpaper() {', 'function Wallpaper({ openAdvisorFor }) {')
          s = s.replace(
              '<a className="button" href="#contacto">Cotizar {selected.name}</a>',
              '<button type="button" className="button" onClick={() => openAdvisorFor(`Cotización: ${selected.name}`)}>Cotizar {selected.name}</button>',
          )
          s = s.replace(
              '<a className="text-button" href="#contacto">Quiero ver opciones para mi pared <ArrowRight size={16} /></a>',
              '<button type="button" className="text-button" onClick={() => openAdvisorFor("Papel tapiz")}>Quiero ver opciones para mi pared <ArrowRight size={16} /></button>',
          )

          s = s.replace(
              'function AdvisorModal({ open, onClose }) {',
              'function AdvisorModal({ open, onClose, context }) {',
          )
          s = s.replace(
              '      `Espacio: ${space}`,\n      "",',
              '      `Espacio: ${space}`,\n      context ? `Interés: ${context}` : null,\n      "",',
          )
          s = s.replace(
              '    ].join("\\n");',
              '    ].filter((line) => line !== null).join("\\n");',
              1,
          )
          s = s.replace(
              '        <p id="advisor-description">Cuéntanos lo básico y prepararemos tu mensaje para WhatsApp. Tú decides cuándo enviarlo.</p>\n        <form onSubmit={continueOnWhatsApp}>',
              '        <p id="advisor-description">Cuéntanos lo básico y prepararemos tu mensaje para WhatsApp. Tú decides cuándo enviarlo.</p>\n        {context && <div className="advisor-context"><span>CONSULTA</span><strong>{context}</strong></div>}\n        <form onSubmit={continueOnWhatsApp}>',
          )

          old_app = '''export function App() {
            const [advisorOpen, setAdvisorOpen] = useState(false);
            const openAdvisor = useCallback(() => setAdvisorOpen(true), []);
            const closeAdvisor = useCallback(() => setAdvisorOpen(false), []);'''
          new_app = '''export function App() {
            const [advisorOpen, setAdvisorOpen] = useState(false);
            const [advisorContext, setAdvisorContext] = useState("");
            const openAdvisor = useCallback(() => {
              setAdvisorContext("");
              setAdvisorOpen(true);
            }, []);
            const openAdvisorFor = useCallback((context) => {
              setAdvisorContext(context);
              setAdvisorOpen(true);
            }, []);
            const closeAdvisor = useCallback(() => setAdvisorOpen(false), []);'''
          if old_app not in s:
              raise SystemExit('App state anchor not found')
          s = s.replace(old_app, new_app)
          s = s.replace('<Products />', '<Products openAdvisorFor={openAdvisorFor} />')
          s = s.replace('<Wallpaper />', '<Wallpaper openAdvisorFor={openAdvisorFor} />')
          s = s.replace(
              '<AdvisorModal open={advisorOpen} onClose={closeAdvisor} />',
              '<AdvisorModal open={advisorOpen} onClose={closeAdvisor} context={advisorContext} />',
          )

          # Load below-the-fold media lazily without changing visible design.
          s = s.replace(
              '<img src={product.media.find((item) => item.type === "image")?.src} alt="" />',
              '<img src={product.media.find((item) => item.type === "image")?.src} alt="" loading="lazy" decoding="async" />',
          )
          s = s.replace(
              '<img src={activeMedia.src} alt={activeMedia.alt} />',
              '<img src={activeMedia.src} alt={activeMedia.alt} loading="lazy" decoding="async" />',
          )
          s = s.replace(
              '                    title={`${selected.name}: ${activeMedia.title}`}\n                    allow=',
              '                    title={`${selected.name}: ${activeMedia.title}`}\n                    loading="lazy"\n                    allow=',
          )
          s = s.replace(
              '{item.type === "image" ? <img src={item.src} alt="" /> :',
              '{item.type === "image" ? <img src={item.src} alt="" loading="lazy" decoding="async" /> :',
          )
          s = s.replace(
              '<img src="/assets/wallpaper-room.jpg" alt="Ambiente HomeEasy con papel tapiz instalado" />',
              '<img src="/assets/wallpaper-room.jpg" alt="Ambiente HomeEasy con papel tapiz instalado" loading="lazy" decoding="async" />',
          )
          s = s.replace(
              '<div className="automation-image"><img src="/assets/homeeasy-hero-room.jpg" alt="Persianas HomeEasy en un espacio automatizado" /><div /></div>',
              '<div className="automation-image"><img src="/assets/homeeasy-hero-room.jpg" alt="Persianas HomeEasy en un espacio automatizado" loading="lazy" decoding="async" /><div /></div>',
          )

          app.write_text(s)

          styles = Path('src/styles.css')
          css = styles.read_text()
          if '.advisor-context {' not in css:
              css = css.replace(
                  '.advisor-modal form { display: grid; gap: 15px; margin-top: 25px; }',
                  '.advisor-context { margin: 18px 0 2px; padding: 11px 13px; display: grid; gap: 4px; border: 1px solid #ded7d4; border-radius: 8px; background: #fff; }\n.advisor-context span { color: #8b817b; font-size: 8px; font-weight: 750; letter-spacing: .1em; }\n.advisor-context strong { color: #3b3531; font-size: 12px; font-weight: 650; }\n.advisor-modal form { display: grid; gap: 15px; margin-top: 25px; }',
              )
          styles.write_text(css)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['name'] = 'homeeasy-web'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          agents = Path('AGENTS.md')
          a = agents.read_text()
          rule = '- Use pnpm as the single package manager for this website. Keep `pnpm-lock.yaml` authoritative; do not reintroduce `package-lock.json` or a workspace file unless the project actually becomes a workspace.\n'
          if rule not in a:
              a += '\n## Repository maintenance\n\n' + rule
          agents.write_text(a)

          lock = Path('package-lock.json')
          if lock.exists(): lock.unlink()

          updated = app.read_text()
          assert 'openAdvisorFor={`' not in updated
          assert 'openAdvisorFor(`Cotización:' in updated
          assert 'Interés: ${context}' in updated
          assert '<Products openAdvisorFor={openAdvisorFor} />' in updated
          assert '<Wallpaper openAdvisorFor={openAdvisorFor} />' in updated
          assert not Path('package-lock.json').exists()
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production site
        run: |
          pnpm run test:hero
          pnpm run test:hommy
          pnpm run build
          pnpm run test:sites

      - name: Commit changes
        run: |
          git config user.name "alejoherrera05-del"
          git config user.email "alejoherrera05@gmail.com"
          git add src/App.jsx src/styles.css package.json AGENTS.md package-lock.json
          git diff --cached --check
          git commit -m "Refine contextual quote paths and repository hygiene"
          git push origin main
