name: HomeEasy Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: homeeasy-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test hero scene
        run: pnpm run test:hero

      - name: Test Hommy recommender
        run: pnpm run test:hommy

      - name: Test iPhone and motion hardening
        run: pnpm run test:motion

      - name: Test mobile catalog
        run: pnpm run test:catalog

      - name: Test local trust and SEO contract
        run: pnpm run test:trust

      - name: Test search metadata
        run: pnpm run test:seo

      - name: Build production site
        run: pnpm run build

      - name: Verify built local trust and SEO contract
        run: HOMEEASY_REQUIRE_DIST=1 pnpm run test:trust

      - name: Test hosting worker
        run: pnpm run test:sites
