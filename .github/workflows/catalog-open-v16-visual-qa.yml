name: Catalog open v16 visual QA

on:
  push:
    branches: [fix/catalog-open-grid-v16]

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare capture helper
        run: |
          cat > /tmp/capture-catalog-v16.mjs <<'NODE'
          import fs from 'node:fs';
          const port=Number(process.env.PORT||4173); const prefix=process.env.PREFIX||'head'; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const page=await (await fetch('http://127.0.0.1:9222/json/new?'+encodeURIComponent(`http://127.0.0.1:${port}/`),{method:'PUT'})).json();
          const ws=new WebSocket(page.webSocketDebuggerUrl); let id=0; const pending=new Map();
          ws.onmessage=e=>{const m=JSON.parse(e.data); if(!m.id||!pending.has(m.id))return; const p=pending.get(m.id); pending.delete(m.id); m.error?p.reject(m.error):p.resolve(m.result);};
          await new Promise(r=>ws.onopen=r);
          const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id; pending.set(n,{resolve,reject}); ws.send(JSON.stringify({id:n,method,params}));});
          await send('Page.enable'); await send('Runtime.enable');
          await send('Emulation.setEmulatedMedia',{features:[{name:'prefers-reduced-motion',value:'no-preference'}]});
          async function load(width,height,mobile){await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile,screenWidth:width,screenHeight:height}); await send('Page.navigate',{url:`http://127.0.0.1:${port}/`}); await sleep(2400);}
          async function captureAt(width,height,mobile,selector,file){
            await load(width,height,mobile);
            await send('Runtime.evaluate',{expression:`(()=>{const n=document.querySelector(${JSON.stringify(selector)}); if(!n)return false; n.scrollIntoView({block:'start'}); scrollBy(0,-76); return true;})()`});
            await sleep(650);
            const r=await send('Page.captureScreenshot',{format:'png'});
            fs.writeFileSync(file,Buffer.from(r.data,'base64'));
          }
          const sizes=[[1440,900,false,'desktop'],[1024,900,false,'medium'],[390,844,true,'mobile']];
          for(const [w,h,m,label] of sizes){
            for(const sectionId of ['recomendador','productos','papel-tapiz','proceso','contacto']) await captureAt(w,h,m,`#${sectionId}`,`${prefix}-${label}-${sectionId}.png`);
            await captureAt(w,h,m,'.product-detail',`${prefix}-${label}-product-detail.png`);
          }
          ws.close();
          NODE
      - name: Start Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          nohup "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/homeeasy-catalog-v16 about:blank >/tmp/chrome.log 2>&1 &
          for i in {1..60}; do curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break; sleep .5; done
      - name: Capture current main
        run: |
          git checkout main
          pnpm install --frozen-lockfile
          node scripts/prepare-process-image.mjs
          pnpm exec vite build --base=/
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --base=/ >/tmp/vite-main.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          PREFIX=before PORT=4173 node /tmp/capture-catalog-v16.mjs
          pkill -f "vite preview.*4173" || true
      - name: Capture proposed version
        run: |
          git checkout "$GITHUB_SHA"
          pnpm install --frozen-lockfile
          pnpm test
          node scripts/prepare-process-image.mjs
          pnpm exec vite build --base=/
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4174 --base=/ >/tmp/vite-head.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          PREFIX=after PORT=4174 node /tmp/capture-catalog-v16.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-open-v16-screenshots
          path: |
            before-*.png
            after-*.png
          retention-days: 1
