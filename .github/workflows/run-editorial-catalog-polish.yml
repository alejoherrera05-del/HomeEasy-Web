name: Run final editorial catalog polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-editorial-catalog-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply polish
        run: python scripts/apply-editorial-catalog-polish.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm run test:hero
          pnpm run test:hommy
          pnpm run build
          pnpm run test:sites

      - name: Commit polish and remove temporary runner
        run: |
          rm scripts/apply-editorial-catalog-polish.py
          rm .github/workflows/run-editorial-catalog-polish.yml
          git config user.name "alejoherrera05-del"
          git config user.email "alejoherrera05@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish editorial catalog hierarchy and filters"
          git push origin main
