name: Experience v6 visual QA

on:
  push:
    branches: [feat/experience-v6]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build
        run: |
          pnpm test
          pnpm exec vite build --base=/
      - name: Verify Safari-safe process photo
        run: |
          test -s dist/client/assets/process-materials-approved.jpg
          file dist/client/assets/process-materials-approved.jpg | grep -q 'JPEG image data'
      - name: Install browser for visual QA
        run: |
          pnpm add -D --ignore-workspace-root-check --lockfile=false playwright@1.55.0
          pnpm exec playwright install --with-deps chromium
      - name: Serve production build
        run: |
          nohup python3 -m http.server 4173 --directory dist/client > /tmp/homeeasy-preview.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/homeeasy-preview.log
          exit 1
      - name: Capture real browser screenshots
        run: |
          mkdir -p visual-qa
          cat > visual-qa-capture.cjs <<'JS'
          const { chromium } = require('playwright');

          const sections = [
            ['recommender', '#recomendador'],
            ['catalog', '#productos'],
            ['wallpaper', '#papel-tapiz'],
            ['process', '#proceso'],
            ['process-story', '#proceso .process-v5-editorial'],
            ['contact', '#contacto'],
          ];

          async function capture(mode, viewport, contextOptions = {}) {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport, ...contextOptions });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1000);

            for (const [name, selector] of sections) {
              const loc = page.locator(selector).first();
              await loc.waitFor({ state: 'attached' });
              await loc.evaluate((el) => {
                const top = el.getBoundingClientRect().top + window.scrollY - 86;
                window.scrollTo({ top, behavior: 'instant' });
              });
              await page.waitForTimeout(900);
              await page.screenshot({ path: `visual-qa/${mode}-${name}.png`, fullPage: false });
            }

            await browser.close();
          }

          (async () => {
            await capture('desktop', { width: 1440, height: 900 });
            await capture('mobile', { width: 390, height: 844 }, {
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 1,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1',
            });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          node visual-qa-capture.cjs
      - name: Upload QA build
        uses: actions/upload-artifact@v4
        with:
          name: homeeasy-experience-v6-qa
          path: dist/client
          retention-days: 1
      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: homeeasy-experience-v6-screenshots
          path: visual-qa
          retention-days: 1
